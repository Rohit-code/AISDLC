# Stack config — ERP frontend (erp-fe)
#
# Machine-readable project facts that agents read before working on this repo:
# operating mode, repo, branches, attribution, staging, stack, test commands,
# board and guardrails. Rules in .claude/rules/ link here instead of restating
# these values.
#
# Other projects copy this file and swap the values for their own stack
# (/aisdlc-init generates it — see .claude/skills/aisdlc-init/SKILL.md).

framework:
  mode: team                     # solo | team — ERP has two engineers (Rohit, Vijay). See .claude/rules/solo-vs-team-mode.md

project: erp
repo: RegnusTech/erp-fe
host: github                     # CLI: gh
local_path: erp-fe/              # gitignored clone inside this workspace (own git)
remote: github                   # git remote name for GitHub; ERP checkouts clone with `git clone -o github ...`
default_branch: main
pr_base: "plan/<stream>"         # the stream branch the ticket names (ERP plan tickets: plan/<stream>, e.g. plan/finance); otherwise default_branch
protected_branches: [master, main, "plan/*"]   # see .claude/rules/source-control.md; agents push only feature/* and hotfix/* branches
commit_attribution: none         # none | co-author — never add Co-Authored-By / Generated with / Claude-Session lines
staging: none                    # no staging environment; a human moves Code Review -> Ready for Production (.claude/rules/kanban-workflow.md)

language: typescript
framework_stack:
  name: nextjs
  version: "15"
  router: app
  react: "19"
styling: "tailwind v3, rem only (no px)"
state_management: none           # no state library
conventions:
  api_client: apiJson
  lists: "usePaginatedList / clientPaged, ResourceList"
  screens: "follow the ERP design boards; no sample data"

test:
  framework: "Vitest + Testing Library (fireEvent; no user-event, no msw)"
  per_ticket: "npx vitest run --maxWorkers=2 <changed test files>"
  typecheck: "npx tsc --noEmit"
  rules: "see erp-fe/CLAUDE.md; never a wide vitest sweep"

board_config: erp-context/board-config.yml   # project-workspace file (in the gitignored erp-context repo); created by /aisdlc-init setup tickets S2/S3.
                                             # If it does not exist: do not invent IDs — stop and ask the user to run /aisdlc-init.
                                             # ERP plan tickets are tracked in the owner's Google Sheet tracker until then (.claude/rules/erp-guardrails.md).
guardrails: .claude/rules/erp-guardrails.md
