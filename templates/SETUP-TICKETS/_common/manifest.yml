# Universal setup tickets — apply to every AISDLC project regardless of stack.
# Init reads this manifest, runs the idempotent_check for each, and creates
# the ticket if the check fails.

# Variables available in idempotent_check commands:
#   $PROJECT       — project slug (e.g. "erp", "support-bot")
#   $CONTEXT_DIR   — path to <project>-context/
#   $MAIN_REPO     — path to the primary code repo
#   $BOARD_ID      — GitHub Projects v2 ID (empty until S2 runs)

tickets:
  - id: S1
    title: "[setup] Create <project>-context/ from PROJECT-CONTEXT template"
    template: S01-context-repo.md
    priority: P1
    owner: Tech
    idempotent_check: "test -f $CONTEXT_DIR/CLAUDE.md"
    depends_on: []

  - id: S2
    title: "[setup] Create project board with 12-column AISDLC pipeline"
    template: S02-project-board.md
    priority: P1
    owner: Tech
    idempotent_check: "test -n \"$BOARD_ID\""
    depends_on: []

  - id: S3
    title: "[setup] Register project in .claude/board-config.yml"
    template: S03-board-config.md
    priority: P1
    owner: Tech
    idempotent_check: "grep -q \"$PROJECT\" .claude/board-config.yml"
    depends_on: [S2]

  - id: S4
    title: "[setup] Clone code repo(s) into workspace"
    template: S04-clone-repos.md
    priority: P1
    owner: Tech
    idempotent_check: "test -d $MAIN_REPO/.git"
    depends_on: []

  - id: S5
    title: "[setup] Pre-work secrets audit — .env, .gitignore, committed keys"
    template: S05-secrets-audit.md
    priority: P0
    owner: AI
    idempotent_check: "grep -q '^\\.env$' $MAIN_REPO/.gitignore && ! git -C $MAIN_REPO ls-files | grep -qE '^\\.env$'"
    depends_on: [S4]

  - id: S6
    title: "[setup] Add .env.example with safe placeholders"
    template: S06-env-example.md
    priority: P1
    owner: AI
    idempotent_check: "test -f $MAIN_REPO/.env.example"
    depends_on: [S4, S5]

  - id: S7
    title: "[setup] Local dev environment — one-command startup"
    template: S07-local-dev-env.md
    priority: P1
    owner: AI
    idempotent_check: "test -f $MAIN_REPO/docker-compose.yml || test -f $MAIN_REPO/Makefile"
    depends_on: [S4, S6]

  - id: S8
    title: "[setup] Add CLAUDE.md to each code repo (codebase context)"
    template: S08-claude-md.md
    priority: P1
    owner: AI
    idempotent_check: "test -f $MAIN_REPO/CLAUDE.md"
    depends_on: [S4]

  - id: S9
    title: "[setup] Declare stack + operating mode in .claude/stack-*.yml"
    template: S09-stack-config.md
    priority: P1
    owner: Tech
    idempotent_check: "ls .claude/stack-*.yml 2>/dev/null | head -1 | grep -q ."
    depends_on: []

  - id: S10
    title: "[setup] Create release/ai-sdlc-v1 branch on each repo"
    template: S10-release-branch.md
    priority: P2
    owner: AI
    idempotent_check: "git -C $MAIN_REPO branch -a | grep -q release/ai-sdlc-v1"
    depends_on: [S4]

  - id: S11
    title: "[setup] Generate Product Wiki — main code repo"
    template: S11-product-wiki.md
    priority: P1
    owner: AI
    idempotent_check: "test -f $MAIN_REPO/docs/Product-Wiki.md"
    depends_on: [S4, S8]

  - id: S12
    title: "[setup] Generate Tech Architecture docs (per stack)"
    template: S12-tech-architecture.md
    priority: P1
    owner: AI
    idempotent_check: "ls $MAIN_REPO/docs/TECH-Architecture-*.md 2>/dev/null | head -1 | grep -q ."
    depends_on: [S4, S11]

  - id: S13
    title: "[setup] Populate codebase indexes via size audit"
    template: S13-codebase-indexes.md
    priority: P1
    owner: AI
    idempotent_check: "ls $CONTEXT_DIR/indexes/Codebase-Index-*.md 2>/dev/null | head -1 | grep -q ."
    depends_on: [S1, S4]

  - id: S14
    title: "[setup] Test infrastructure — runnable test command"
    template: S14-test-infrastructure.md
    priority: P1
    owner: AI
    idempotent_check: "grep -qE 'pytest|vitest|jest|go test' $MAIN_REPO/package.json $MAIN_REPO/pyproject.toml $MAIN_REPO/requirements*.txt 2>/dev/null"
    depends_on: [S4, S7]

  - id: S15
    title: "[setup] Create API/event contracts directory in context repo"
    template: S15-contracts-dir.md
    priority: P2
    owner: Tech
    idempotent_check: "test -d $CONTEXT_DIR/contracts"
    depends_on: [S1]
