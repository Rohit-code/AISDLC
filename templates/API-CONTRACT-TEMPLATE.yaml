# API Contract Template
# Generated by @planner agent from FRD
# Published to <project>-context/contracts/{feature-name}.yaml
# This is the single source of truth for BE implementation and FE consumption

openapi: "3.0.3"
info:
  title: "[Feature Name] API Contract"
  version: "1.0.0"
  description: |
    FRD: #NNN
    Generated by: @planner
    Status: Draft / Approved

paths:
  /resource/:
    post:
      summary: "Create resource"
      operationId: createResource
      tags:
        - Resource
      security:
        - bearerAuth: []
      x-permissions:
        - IsAuthenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: "Resource created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /resource/{id}/:
    get:
      summary: "Get resource by ID"
      operationId: getResource
      tags:
        - Resource
      security:
        - bearerAuth: []
      x-permissions:
        - IsAuthenticated
        - IsOwner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Resource details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateResourceRequest:
      type: object
      required:
        - field1
      properties:
        field1:
          type: string
          description: "Description of field"
        field2:
          type: integer
          default: 0
          description: "Optional field"

    ResourceResponse:
      type: object
      properties:
        id:
          type: integer
        field1:
          type: string
        field2:
          type: integer
        created_at:
          type: string
          format: date-time

  responses:
    ValidationError:
      description: "Validation failed"
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                enum: [VALIDATION_ERROR]

    Unauthorized:
      description: "Authentication required"
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                enum: [UNAUTHORIZED]

    Forbidden:
      description: "Permission denied"
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                enum: [PERMISSION_DENIED]

    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                enum: [NOT_FOUND]

