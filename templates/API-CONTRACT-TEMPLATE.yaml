# API Contract Template
# Generated by @planner agent from FRD
# Published to <project>-context/contracts/{feature-name}.yaml
# This is the single source of truth for BE implementation and FE consumption.
#
# Conventions (ERP defaults; a project may override them in its stack file):
# - Paths: /api/<resources> and /api/<resources>/{id} — no trailing slash.
# - Access: each operation names a permission key `resource:action` in
#   x-permission. Roles are IAM policies that grant keys; never list role names.
#   BE enforces it with @RequirePermission("resource:action").
# - Tenant scoping: every record belongs to the caller's tenant (from the auth
#   token, never from the request body or a header). Records of another tenant
#   answer 404, not 403, so their existence is not revealed.
# - Envelope: every response body is the ApiResponse envelope
#   { success, message, data, error: { code, message, details?, requestId? }, timestamp }.
#   `data` holds the schema named per response below.
# - Versioning: additive changes (new optional field, new endpoint) keep the
#   contract version's MAJOR. Removing/renaming a field or changing its type is a
#   breaking change: bump MAJOR in info.version and agree the FE migration in the
#   [Contract] sub-issue first.

openapi: "3.0.3"
info:
  title: "[Feature Name] API Contract"
  version: "1.0.0"
  description: |
    FRD: #NNN
    Generated by: @planner
    Status: Draft / Approved

paths:
  /api/<resources>:
    get:
      summary: "List resources (paged)"
      operationId: listResources
      tags:
        - Resource
      security:
        - bearerAuth: []
      x-permission: "<resource>:read"
      x-tenant-scoped: true
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: "One page of resources (data = ResourcePage)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ResourcePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      summary: "Create resource"
      operationId: createResource
      tags:
        - Resource
      security:
        - bearerAuth: []
      x-permission: "<resource>:create"
      x-tenant-scoped: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: "Resource created (data = ResourceResponse)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ResourceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/<resources>/{id}:
    get:
      summary: "Get resource by ID"
      operationId: getResource
      tags:
        - Resource
      security:
        - bearerAuth: []
      x-permission: "<resource>:read"
      x-tenant-scoped: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Resource details (data = ResourceResponse)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ResourceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      description: "Zero-based page number"
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: "Page size (server caps it; state the cap here)"
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: "field,asc|desc — only fields listed here are sortable: createdAt, field1"
      schema:
        type: string
        example: "createdAt,desc"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on creates and on any money movement (payments, refunds, postings).
        A repeat with the same key and body returns the first result; the same key
        with a different body answers 409.
      schema:
        type: string
        format: uuid

  schemas:
    ApiResponse:
      type: object
      required: [success, timestamp]
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          nullable: true
          description: "Payload; its schema is named per response"
        error:
          $ref: "#/components/schemas/ErrorDetail"
        timestamp:
          type: string
          format: date-time

    ErrorDetail:
      type: object
      nullable: true
      required: [code, message]
      properties:
        code:
          type: string
          description: "Stable wire code of the ErrorCode enum (BE: BusinessException(ErrorCode.X)), e.g. VAL_001, AUTHZ_002, MST_001"
        message:
          type: string
        details:
          type: object
          nullable: true
          description: "Optional extra data; for validation errors, field name -> message"
          additionalProperties: true
        requestId:
          type: string
          nullable: true
          description: "Server reference of the request (also the X-Request-Id header)"

    CreateResourceRequest:
      type: object
      required:
        - field1
      properties:
        field1:
          type: string
          description: "Description of field"
        field2:
          type: integer
          default: 0
          description: "Optional field"

    ResourceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        field1:
          type: string
        field2:
          type: integer
        createdAt:
          type: string
          format: date-time

    ResourcePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ResourceResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

  responses:
    ValidationError:
      description: "Validation failed (error.code e.g. VAL_001; error.details = field -> message)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

    Unauthorized:
      description: "Authentication required"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

    Forbidden:
      description: "Caller lacks the permission key named in x-permission"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

    NotFound:
      description: "Not found, or belongs to another tenant"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

    Conflict:
      description: "Duplicate (e.g. MST_001) or Idempotency-Key reused with a different body"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

# x-permission-matrix (permission keys, not roles; IAM policies grant the keys):
#   GET  /api/<resources>       -> <resource>:read    (tenant-scoped list)
#   POST /api/<resources>       -> <resource>:create  (Idempotency-Key required)
#   GET  /api/<resources>/{id}  -> <resource>:read    (other tenant -> 404)
# Record-level limits beyond tenant (e.g. "own branch only") are data-scope rules:
# name the rule here and where it is enforced.
